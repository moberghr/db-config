name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Opt into Node.js 24 for JS-based actions (setup-dotnet, setup-node, checkout).
  # Node 20 is deprecated on GitHub Actions runners from 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: ${{ matrix.category }} (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The packages multi-target net8.0;net10.0 — run every category against both so
        # EF 8 and EF 10 behavior is exercised. 4 categories × 2 TFMs = 8 jobs.
        tfm: [net8.0, net10.0]
        category: [Unit, SqlServer, PostgreSql, E2E]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0
            10.0

      - name: Setup Node.js (for DbConfig.Ui npm build)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Must run before `dotnet build` — the EmbeddedResource glob in DbConfig.Ui.csproj
      # is evaluated at MSBuild project-load time. If ui/dist/ doesn't exist by then,
      # the glob matches nothing and the embedded React bundle is empty, breaking the
      # UI static-asset serving tests.
      - name: Build UI bundle
        working-directory: ui
        run: npm run build

      - name: Restore
        working-directory: src
        run: dotnet restore tests/DbConfig.Tests/DbConfig.Tests.csproj

      - name: Build
        working-directory: src
        run: dotnet build tests/DbConfig.Tests/DbConfig.Tests.csproj --no-restore --configuration Release -f ${{ matrix.tfm }}

      # The xUnit v3 Microsoft Testing Platform runner exits with code 5 ("zero tests ran")
      # under `dotnet test` even when tests exist (see CLAUDE.md §8.5 / project-specific.md).
      # Invoke the test executable directly to get a reliable exit code.
      - name: Test (${{ matrix.category }} on ${{ matrix.tfm }})
        working-directory: src/tests/DbConfig.Tests/bin/Release/${{ matrix.tfm }}
        run: |
          ./DbConfig.Tests \
            --filter-trait "Category=${{ matrix.category }}" \
            --report-trx --report-trx-filename test-results.trx \
            --results-directory "$GITHUB_WORKSPACE/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.category }}-${{ matrix.tfm }}
          path: test-results/*.trx
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        with:
          check_name: ${{ matrix.category }} tests (${{ matrix.tfm }})
          files: test-results/**/*.trx
          comment_mode: off
